name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Baked into the browser bundle at build time; the same value the Dockerfile uses.
      NEXT_PUBLIC_THEMIS_API_BASE: /api/themis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify NEXT_PUBLIC_THEMIS_API_BASE landed in the browser bundle
        run: npm run verify:bundle
